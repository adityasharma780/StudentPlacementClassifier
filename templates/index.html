<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassifyMyPlacement</title>
<style>
  :root {
    --glass: rgba(255,255,255,0.14);
    --glass-strong: rgba(255,255,255,0.22);
    --glass-border: rgba(255,255,255,0.38);
    --glass-border-soft: rgba(255,255,255,0.16);
    --ink: #F5F6FA;
    --ink-dim: rgba(245,246,255,0.62);
    --accent: #7C6CFF;
    --accent2: #FF6FA3;
    --green: #3DE6A0;
    --red: #FF7A6E;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }

  body {
    background: #000000;
    overflow-x: hidden;
    position: relative;
  }

  .masthead {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 56px 24px 18px;
  }

  .masthead h1 {
    margin: 0;
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .masthead p {
    margin: 8px 0 0;
    color: var(--ink-dim);
    font-size: 0.95rem;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 980px;
    margin: 10px auto 70px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 22px;
  }

  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; }
  }

  /* Glass panel base */
  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    backdrop-filter: blur(28px) saturate(170%);
    -webkit-backdrop-filter: blur(28px) saturate(170%);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.28),
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -1px 0 rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  .glass::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.16), transparent);
    pointer-events: none;
  }

  .form-panel { padding: 30px 30px 32px; }

  .panel-label {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin: 0 0 18px;
    position: relative;
    z-index: 1;
  }

  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 14px;
    position: relative;
    z-index: 1;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 0.76rem;
    color: var(--ink-dim);
  }

  input, select {
    width: 100%;
    padding: 11px 14px;
    border-radius: 14px;
    border: 1px solid var(--glass-border-soft);
    background: rgba(255,255,255,0.09);
    color: var(--ink);
    font-size: 0.92rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input::placeholder { color: rgba(245,246,255,0.35); }

  input:focus, select:focus {
    border-color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.14);
  }

  select option { background: #241947; color: var(--ink); }

  button {
    margin-top: 22px;
    width: 100%;
    padding: 15px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 0.96rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(124,108,255,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
    z-index: 1;
  }

  button:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(124,108,255,0.55), inset 0 1px 0 rgba(255,255,255,0.5); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.55; cursor: default; transform: none; }

  .err {
    margin-top: 12px;
    color: var(--red);
    font-size: 0.82rem;
    position: relative;
    z-index: 1;
  }

  .result-panel {
    padding: 30px 30px 32px;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  .verdict-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.88rem;
    padding: 30px 10px;
    position: relative;
    z-index: 1;
  }

  .verdict { text-align: center; padding: 6px 0 4px; position: relative; z-index: 1; }

  .verdict .label {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
  }

  .verdict .value {
    font-size: 2.5rem;
    font-weight: 700;
    margin: 8px 0 4px;
    letter-spacing: -0.02em;
  }

  .verdict .value.placed { color: var(--green); text-shadow: 0 0 24px rgba(61,230,160,0.5); }
  .verdict .value.not-placed { color: var(--red); text-shadow: 0 0 24px rgba(255,122,110,0.5); }

  .meter-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--ink-dim);
    margin: 20px 0 8px;
    position: relative;
    z-index: 1;
  }

  .meter {
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
    z-index: 1;
  }

  .meter-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.7s cubic-bezier(0.22,1,0.36,1);
  }

  .threshold-mark {
    position: absolute;
    top: -3px; bottom: -3px;
    width: 2px;
    background: rgba(255,255,255,0.85);
  }

  .note {
    font-size: 0.76rem;
    color: var(--ink-dim);
    line-height: 1.55;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--glass-border-soft);
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="masthead">
  <h1>ClassifyMyPlacement</h1>
  <p>Placement likelihood estimate from academic and skills profile</p>
</div>

<div class="wrap">

  <div class="glass form-panel">
    <p class="panel-label">STUDENT PROFILE</p>
    <form id="predictForm">
      <div class="grid2">
        <div class="field">
          <label for="cgpa">CGPA (0&ndash;10)</label>
          <input type="number" step="0.01" min="0" max="10" id="cgpa" value="7.5" required>
        </div>
        <div class="field">
          <label for="backlogs">Backlogs</label>
          <input type="number" step="1" min="0" id="backlogs" value="0" required>
        </div>
        <div class="field">
          <label for="internships">Internships</label>
          <input type="number" step="1" min="0" id="internships" value="1" required>
        </div>
        <div class="field">
          <label for="certifications">Certifications</label>
          <input type="number" step="1" min="0" id="certifications" value="2" required>
        </div>
        <div class="field">
          <label for="coding_skills">Coding Skills (0&ndash;10)</label>
          <input type="number" step="0.1" min="0" max="10" id="coding_skills" value="6" required>
        </div>
        <div class="field">
          <label for="communication_skills">Communication Skills (0&ndash;10)</label>
          <input type="number" step="0.1" min="0" max="10" id="communication_skills" value="6" required>
        </div>
        <div class="field">
          <label for="aptitude_score">Aptitude Score (0&ndash;100)</label>
          <input type="number" step="1" min="0" max="100" id="aptitude_score" value="60" required>
        </div>
        <div class="field">
          <label for="projects">Projects</label>
          <input type="number" step="1" min="0" id="projects" value="2" required>
        </div>
        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="field">
          <label for="degree">Degree</label>
          <select id="degree">
            <option value="BTech">BTech</option>
            <option value="BE">BE</option>
            <option value="BCA">BCA</option>
            <option value="BSc">BSc</option>
          </select>
        </div>
        <div class="field full">
          <label for="branch">Branch</label>
          <select id="branch">
            <option value="CS">CS</option>
            <option value="IT">IT</option>
            <option value="AI">AI</option>
            <option value="DS">DS</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Electrical">Electrical</option>
          </select>
        </div>
      </div>
      <button type="submit" id="submitBtn">Estimate Placement Likelihood</button>
      <div id="errBox" class="err" style="display:none;"></div>
    </form>
  </div>

  <div class="glass result-panel">
    <p class="panel-label">ESTIMATE</p>
    <div id="resultArea">
      <div class="verdict-empty">Fill in the profile and submit<br>to see an estimate here.</div>
    </div>
  </div>

</div>

<script>
const form = document.getElementById('predictForm');
const resultArea = document.getElementById('resultArea');
const errBox = document.getElementById('errBox');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Estimating...';

  const payload = {
    cgpa: parseFloat(document.getElementById('cgpa').value),
    backlogs: parseInt(document.getElementById('backlogs').value),
    internships: parseInt(document.getElementById('internships').value),
    certifications: parseInt(document.getElementById('certifications').value),
    coding_skills: parseFloat(document.getElementById('coding_skills').value),
    communication_skills: parseFloat(document.getElementById('communication_skills').value),
    aptitude_score: parseFloat(document.getElementById('aptitude_score').value),
    projects: parseInt(document.getElementById('projects').value),
    gender: document.getElementById('gender').value,
    degree: document.getElementById('degree').value,
    branch: document.getElementById('branch').value
  };

  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData.detail || 'Something went wrong.');
    }

    const data = await res.json();
    const pct = Math.round(data.probability * 100);
    const thresholdPct = Math.round(data.threshold_used * 100);
    const isPlaced = data.prediction === 'Placed';

    resultArea.innerHTML = `
      <div class="verdict">
        <div class="label">PREDICTED OUTCOME</div>
        <div class="value ${isPlaced ? 'placed' : 'not-placed'}">${data.prediction}</div>
      </div>
      <div class="meter-row">
        <span>Placement probability</span>
        <span>${pct}%</span>
      </div>
      <div class="meter">
        <div class="meter-fill" style="width:${pct}%"></div>
        <div class="threshold-mark" style="left:${thresholdPct}%"></div>
      </div>
      <div class="note">
        Decision threshold set at ${thresholdPct}% &mdash; chosen to favor precision, so a "Placed" result only shows when the model is reasonably confident. This is an estimate from a trained model, not a guarantee.
      </div>
    `;
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Estimate Placement Likelihood';
  }
});
</script>

</body>
</html>
